# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-2025-vs2026

    steps:
    - uses: actions/checkout@v7
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore IIGO\IIGO.slnx
    - name: Build
      run: msbuild IIGO\IIGO.slnx /verbosity:minimal
    - name: Build installer
      run: msbuild IIGO.Installer\IIGO.Installer.wixproj -restore /p:Configuration=Release /verbosity:minimal
    - name: Upload installer
      uses: actions/upload-artifact@v7
      with:
        name: IIGO Panel installer
        path: IIGO.Installer\bin\Release\*.msi
